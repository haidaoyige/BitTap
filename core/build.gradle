plugins { id 'java-library' }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
dependencies {
    implementation('org.bitcoinj:bitcoinj-core:0.17.1') {
        exclude group: 'org.bouncycastle'
    }
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.86'
    // Explicit security baselines; do not silently inherit older transitive versions.
    implementation 'com.google.guava:guava:33.7.2-android'
    implementation 'com.google.protobuf:protobuf-javalite:4.36.2'
    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'org.slf4j:slf4j-nop:2.0.20'
}
test {
    maxHeapSize = '512m'
    systemProperty 'bittap.fixtureDir', layout.buildDirectory.get().asFile.absolutePath
}
