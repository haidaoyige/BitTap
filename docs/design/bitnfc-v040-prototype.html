    }
    function modal(v){
      if(!v.sheet)return '';
      let inner='';
      if(v.sheet==='scanning')inner=`<h3>${v.scanType==='write'?'请贴卡，先检查卡片':'请贴卡，读取冷钱包'}</h3><p>将卡片贴近手机背面的 NFC 感应区。</p>${scan()}<div class="cg-scanstatus"><span class="cg-dot"></span>等待识别卡片…</div><div class="cg-actions">${link('取消','cancel-sheet')}</div>`;
      if(v.sheet==='card-ready')inner=`<h3>${settings.writeCase==='已有内容'?'这张卡片已有内容':'卡片已就绪'}</h3><p>${settings.writeCase==='已有内容'?'继续写入会覆盖卡片原有内容。请确认这张卡片可以覆盖。':'可写状态与容量检查通过。确认后，请再次贴回同一张卡片。'}</p><div class="cg-detailrow"><strong><span>本次操作</span><span>${settings.writeCase==='已有内容'?'覆盖并写入':v.duplicate?'写入同一钱包的副本':'写入新冷钱包'}</span></strong></div><div class="cg-detailrow"><strong><span>写入后核验</span><span>自动读回</span></strong></div><div class="cg-actions">${btn(settings.writeCase==='已有内容'?'确认覆盖并写入':'确认写入','write-confirm')}${link('取消，保留原内容','cancel-sheet')}</div>`;
      if(v.sheet==='writing')inner=`<h3>正在写入并核对</h3><p>请保持卡片贴合，完成前不要移开。</p>${scan()}<div class="cg-scanstatus"><span class="cg-dot"></span>写入 → 读回 → 核对内容</div>`;
      if(v.sheet==='write-error'){
        const desc=settings.writeCase==='容量不足'?['这张卡片容量不足','没有写入任何新数据。请换一张容量足够的卡片后重试。']:settings.writeCase==='NFC 关闭'?['请先开启 NFC','开启手机 NFC 后，返回这里继续。当前冷钱包会保留。']:['卡片移开，尚未确认完成','写入可能没有完成。请先重新读取卡片，确认数据后再重试。'];
        inner=`<h3>${desc[0]}</h3><p>${desc[1]}</p><div class="cg-actions">${btn(settings.writeCase==='NFC 关闭'?'去开启 NFC':settings.writeCase==='容量不足'?'换一张卡片':'重新检测卡片',settings.writeCase==='NFC 关闭'?'enable-nfc':'retry-write')}${link('先保存加密备份','backup')}${link('返回','cancel-sheet')}</div>`;
      }
      if(v.sheet==='backup')inner=`<h3>${v.pendingCopy?'先保存备份，再继续写卡':'保存加密备份'}</h3><p>${v.pendingCopy?'保存备份文件后，将自动进入另一张 NFC 卡的写入流程。备份里不包含密码，请分开保管。':'卡片损坏或遗失后，可用备份和密码恢复。请保存一份备份文件，再完成制作。备份里不包含密码，请分开保管。'}</p><div class="cg-info"><div class="cg-infohead"><span>BitNFC 加密备份</span><span>CG1</span></div><div class="cg-address">CG1:····················</div></div><div class="cg-actions">${btn(v.pendingCopy?'保存备份并继续':'保存为文件','save-backup','primary','file-down')}${btn('复制加密文本','copy-backup','secondary','copy')}${link('返回','cancel-sheet')}</div>`;
      if(v.sheet==='addresses')inner=`<h3>其他收款地址</h3><p>${v.screen==='unlock'?'以下为卡片记录的四种公开地址，可直接查看和复制；尚未与私钥核对，解密后将自动核验。':'四种地址共用一把私钥，余额分别记录。使用时请核对实际收款地址。'}</p>${[['原生 SegWit','bc1q ···· 7a2f','推荐'],['Legacy','1 ···· 9m3k',''],['嵌套 SegWit','3 ···· 5h8v',''],['Taproot','bc1p ···· 6d2r','需确认恢复兼容']].map(([a,b,c])=>`<div class="cg-detailrow"><strong><span>${a}</span><span style="font-size:11px;color:var(--cg-sub)">${c}</span></strong><div class="cg-address">${b}</div><button type="button" class="cg-inlinecopy cursor-interaction" data-action="copy-address">${icon('copy')}复制地址</button></div>`).join('')}<div class="cg-actions">${btn('知道了','cancel-sheet','secondary')}</div>`;
      if(v.sheet==='qr')inner=`<h3>用自己的钱包扫描</h3><p>二维码等同于私钥，不要截图或发给他人。</p><div class="cg-qr" aria-label="不可用于导入的示例二维码">${qrCells()}</div><div class="cg-footnote">原型示例 · 不用于导入</div><div class="cg-actions">${btn('关闭二维码','cancel-sheet','secondary')}</div>`;
      if(v.sheet==='help')inner=`<h3>你的卡片，你来掌握</h3><p>制作时设置密码，并把加密私钥写入 NFC。读取时输入密码，即可恢复私钥。</p><div class="cg-checklist"><div>${icon('wifi-off')}加解密在本机完成，无需联网</div><div>${icon('key-round')}密码无法重置，请单独保管</div><div>${icon('scan-line')}NFC 卡片可以被复制</div></div><div class="cg-notice" style="margin-top:20px">这张卡是密钥的存储载体，App 不查询余额或发送 BTC。</div><div class="cg-actions">${btn('知道了','cancel-sheet','secondary')}</div>`;
      if(v.sheet==='restore-help')inner=`<h3>如何转出 BTC</h3><ol class="cg-recoverylist"><li><span class="cg-recoverynumber" aria-hidden="true">1</span><div><h4>使用支持 WIF 的钱包</h4><p>本工具导出的是 BTC 主网 WIF 格式私钥。请使用支持该格式及对应地址类型的钱包。不清楚操作时，可向 AI 咨询步骤，<strong>切勿提供私钥或私钥二维码</strong>。</p></div></li><li><span class="cg-recoverynumber" aria-hidden="true">2</span><div><h4>尽快转入新钱包</h4><p>复制或导入私钥会增加泄露风险。建议尽快将全部 BTC 转入已完成备份的新钱包，确认到账后，停止使用旧地址收款。</p></div></li><li><span class="cg-recoverynumber" aria-hidden="true">3</span><div><h4>余额不符时，核对地址类型</h4><p>请确认钱包识别出的地址与实际存币地址一致，并检查地址类型及钱包同步状态。</p></div></li></ol><div class="cg-actions">${btn('知道了','cancel-sheet','secondary')}</div>`;
      if(v.sheet==='restart')inner=`<h3>制作另一张卡片？</h3><p>开始前，请确认上一张卡片的加密备份和密码已保存。</p><div class="cg-actions">${btn('已保存，开始制作','restart-confirm')}${link('继续保留当前卡片','cancel-sheet')}</div>`;
      if(v.sheet==='file')inner=`<h3>打开加密备份文件</h3><p>选择你之前保存的 BitNFC 备份。</p><div class="cg-info"><div class="cg-infohead"><span>演示文件</span><span>TXT</span></div><div>bitnfc-mainnet-7a2f.txt</div></div><div class="cg-actions">${btn('打开这份备份','accept-backup','primary','file-check')}${link('取消','cancel-sheet')}</div>`;
      return `<div class="cg-modalshade" role="presentation"><section class="cg-sheet" role="dialog" aria-modal="true" aria-label="操作确认"><div class="cg-grabber"></div>${inner}</section></div>`;
    }
    function qrCells(){let cells='';for(let y=0;y<21;y++)for(let x=0;x<21;x++){let finder=null;for(const [a,b] of [[0,0],[14,0],[0,14]])if(x>=a&&x<a+7&&y>=b&&y<b+7){const i=x-a,j=y-b;finder=i===0||i===6||j===0||j===6||(i>=2&&i<=4&&j>=2&&j<=4)}const fill=finder===null?((x*17+y*13+x*y)%7<3):finder;cells+=`<i class="${fill?'filled':''}"></i>`}return cells}
    function render(v){
      v.stage.dataset.cgScreen=v.screen;
      v.stage.classList.toggle('cg-density-compact',settings.density==='紧凑');
      v.stage.innerHTML=routes(v)+`<div class="cg-phone" aria-label="${v.direct?'直接开始':'分步引导'}手机原型"><div class="cg-status"><span>9:41</span><span class="cg-statusicons">${icon('signal')}${icon('wifi')}${icon('battery-full')}</span></div><div class="cg-main">${header(v)}${content(v)}</div><div class="cg-homebar"></div>${modal(v)}${v.toast?`<div class="cg-toast" role="status">${v.toast}</div>`:''}</div>`;
      v.stage.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>go(v,b.dataset.jump));
      v.stage.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(v,b.dataset.action,b));
      v.stage.querySelectorAll('input').forEach(input=>input.oninput=()=>{v.inputs[input.id]=input.value});
      v.stage.querySelectorAll('.cg-primary').forEach(b=>{if(v.busy&&!['scan-write','write-confirm'].includes(b.dataset.action))b.disabled=true});
      if(globalThis.lucide)lucide.createIcons({root:v.stage,attrs:{width:16,height:16}});
    }
    function remember(v){if(window.openai&&window.openai.setWidgetState)window.openai.setWidgetState({modelContent:{prototype:'BitNFC 0.4.0',scheme:v.direct?'直接开始':'分步引导',screen:v.screen,writeCase:settings.writeCase,decryptCase:settings.decryptCase,cardCount:v.cardCount},privateContent:{id:v.id,screen:v.screen,backup:v.backup,duplicate:v.duplicate,cardCount:v.cardCount}}).catch(()=>{})}
    function go(v,s){v.token++;v.busy=false;v.error='';v.pendingCopy=false;v.sheet=null;v.reveal=false;if(s==='home')v.duplicate=false;v.screen=s==='home'&&v.direct?'password':s;render(v);remember(v)}
    function later(v,ms,fn){const token=v.token;setTimeout(()=>{if(v.token===token)fn()},ms)}
    function scanWrite(v){v.sheet='scanning';v.scanType='write';render(v);later(v,850,()=>{v.sheet=['容量不足','NFC 关闭'].includes(settings.writeCase)?'write-error':'card-ready';render(v)})}
    function scanRead(v){v.sheet='scanning';v.scanType='read';render(v);later(v,900,()=>go(v,'unlock'))}
    function act(v,a,b){
      if(a==='eye'){const inp=v.stage.querySelector('#'+b.dataset.for);if(inp){const shown=inp.type==='password';inp.type=shown?'text':'password';b.setAttribute('aria-label',shown?'隐藏密码':'显示密码');b.innerHTML=icon(shown?'eye':'eye-off');if(globalThis.lucide)lucide.createIcons({root:b,attrs:{width:16,height:16}})}return}
      if(a==='make'){v.verify=false;go(v,'password');return}
      if(a==='read'){v.verify=false;go(v,'read');return}
      if(a==='home'){if(v.screen==='done'&&!v.backup){v.sheet='backup';render(v);return}v.verify=false;go(v,'home');return}
      if(a==='back'){if(v.screen==='done'){if(!v.backup){v.sheet='backup';render(v)}else go(v,'home');return}if(v.screen==='write'&&v.duplicate){v.duplicate=false;go(v,'done');return}go(v,({write:'password',unlock:'read',revealed:'unlock',paste:'read'})[v.screen]||'home');return}
      if(a==='generate'){
        const p=v.stage.querySelector('#'+v.id+'-pass').value,q=v.stage.querySelector('#'+v.id+'-confirm').value;
        if(p.length<6||!p.trim()){v.error='请设置至少 6 个字符的密码。';render(v);return}
        if(p!==q){v.error='两次密码不一致，请重新确认。';render(v);return}
        v.demoPassword=p;v.busy=true;v.error='';render(v);later(v,700,()=>{v.backup=false;v.duplicate=false;v.cardCount=0;go(v,'write')});return;
      }
      if(a==='scan-write'){scanWrite(v);return}
      if(a==='retry-write'){settings.writeCase='空白卡片';scanWrite(v);return}
      if(a==='enable-nfc'){settings.writeCase='空白卡片';v.sheet=null;v.toast='NFC 已开启 · 原型演示';render(v);later(v,1500,()=>{v.toast='';render(v)});return}
      if(a==='write-confirm'){v.sheet='writing';render(v);later(v,950,()=>{if(settings.writeCase==='卡片移开'){v.sheet='write-error';render(v)}else{v.cardCount=Math.max(v.cardCount,v.duplicate?1:0)+1;v.duplicate=false;go(v,'done')}});return}
      if(a==='scan-read'){scanRead(v);return}
      if(a==='accept-backup'){go(v,'unlock');return}
      if(a==='decrypt'){
        const input=v.stage.querySelector('#'+v.id+'-unlock');
        if(!input.value){v.error='请输入卡片解密密码。';render(v);return}
        const matches=input.value===v.demoPassword;
        v.busy=true;v.error='';render(v);later(v,750,()=>{v.busy=false;if(!matches||settings.decryptCase!=='正常解密'){v.error=!matches||settings.decryptCase==='密码错误'?'密码不正确，请重新输入。':'数据验证未通过，请重新读卡或使用备份。';render(v)}else if(v.verify){v.verify=false;go(v,'done');v.toast='恢复验证通过';render(v);later(v,1600,()=>{v.toast='';render(v)})}else go(v,'revealed')});return;
      }
      if(a==='secret'){v.reveal=!v.reveal;render(v);if(v.reveal)later(v,30000,()=>{v.reveal=false;render(v)});return}
      if(a==='copy-address'||a==='copy-private'){copy(v);return}
      if(a==='finish-backup'){if(v.backup)go(v,'home');else{v.sheet='backup';render(v)}return}
      if(a==='write-another'){if(!v.backup){v.pendingCopy=true;v.sheet='backup';render(v);return}v.cardCount=Math.max(v.cardCount,1);v.duplicate=true;go(v,'write');return}
      if(a==='save-backup'){const continueCopy=v.pendingCopy;v.backup=true;v.pendingCopy=false;v.sheet=null;if(continueCopy){v.cardCount=Math.max(v.cardCount,1);v.duplicate=true;go(v,'write')}v.toast='加密备份文件已保存 · 原型演示';render(v);later(v,1600,()=>{v.toast='';render(v)});remember(v);return}
      if(a==='copy-backup'){v.toast='加密文本已复制，请继续保存备份文件 · 原型演示';render(v);later(v,1600,()=>{v.toast='';render(v)});return}
      if(a==='restart-confirm'){v.backup=false;go(v,'password');return}
      if(a==='cancel-sheet'){v.token++;v.pendingCopy=false;v.sheet=null;render(v);return}
      if(a==='exit'){v.reveal=false;go(v,'home');return}
      if(a==='paste'){go(v,'paste');return}
      if(['backup','addresses','qr','help','restore-help','restart','file'].includes(a)){v.sheet=a;render(v);if(a==='qr')later(v,60000,()=>{v.sheet=null;render(v)});return}
    }
    root.querySelectorAll('[data-stage]').forEach(stage=>{
      const id=stage.dataset.stage;const direct=id==='direct';
      const v={id,stage,direct,screen:direct?'password':'home',sheet:null,error:'',busy:false,reveal:false,backup:false,duplicate:false,pendingCopy:false,cardCount:0,toast:'',verify:false,token:0,inputs:{},demoPassword:'BitNFC-demo-only'};states[id]=v;render(v);
      if(globalThis.Tweak){
        const t=new Tweak({container:stage,onChange:()=>{root.style.setProperty('--cg-radius',settings.radius+'px');Object.values(states).forEach(render)}});
        t.addSlider(settings,'radius',{label:'卡片圆角',min:8,max:26,step:2,unit:'px'});
        t.addSelect(settings,'density',{label:'页面留白',options:['舒展','紧凑']});
        t.addSelect(settings,'writeCase',{label:'写卡情境',options:['空白卡片','已有内容','容量不足','卡片移开','NFC 关闭']});
        t.addSelect(settings,'decryptCase',{label:'解密情境',options:['正常解密','密码错误','数据损坏']});
      }
    });
    function restore(data){const p=data&&data.privateContent;if(!p||!states[p.id])return;const allowed=['home','password','write','done','read','paste','unlock','revealed'];if(!allowed.includes(p.screen))return;const v=states[p.id];v.screen=p.screen;v.backup=!!p.backup;v.pendingCopy=false;v.duplicate=!!p.duplicate&&p.screen==='write';v.cardCount=Number.isInteger(p.cardCount)&&p.cardCount>=0?p.cardCount:0;v.sheet=null;v.reveal=false;render(v)}
    restore(window.openai&&window.openai.widgetState);
    window.addEventListener('openai:set_globals',e=>restore(e.detail&&e.detail.globals&&e.detail.globals.widgetState));
  })();
  </script>
</div>
