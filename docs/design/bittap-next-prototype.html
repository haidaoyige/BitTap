rabilities or compatibility issues; that random-number generation, key generation, address derivation, encryption, decryption, NFC reading and writing, backups or recovery will work correctly on every device or in every environment; or that the software will be suitable for a particular purpose, remain available or maintained, or prevent every loss of assets."},{"type":"p","text":"Open-source code, test results, security checks, verification messages in the interface and other technical information do not constitute guarantees of absolute security, freedom from loss of BTC, successful recovery or asset value. Test or audit findings apply only to the versions and scope actually covered."},{"type":"heading","text":"3. Risk of total and irreversible loss"},{"type":"p","text":"**Users should understand that use, inability to use or misuse of the software may cause the loss of some or all BTC, with no possibility of recovery.** Risks include, but are not limited to:"},{"type":"list","items":["Defects in the software, dependencies or cryptographic implementation, or problems with the device's random source, operating system, firmware or hardware;","A compromised phone, or exposure of sensitive information through malware, input methods, the clipboard, screen recordings, screenshots, synchronization or backup functions;","Forgotten or weak passwords, exposed private keys, or third parties obtaining plaintext private keys or private-key QR-code images;","NFC cards being copied, altered, damaged or lost, or failures to write, read back, export, save or read data;","Incorrect receiving addresses, mismatched address types, incompatible destination wallets or use of unverified backups;","Third-party software modifications, counterfeit installation packages, malicious websites, phishing, social engineering or third-party service failures."]},{"type":"p","text":"The Project Parties generally cannot reset decryption passwords, reconstruct lost private keys, reverse on-chain transactions or recover stolen or mistakenly transferred BTC. Ultimate legal liability is determined by applicable law, the specific facts and valid agreements, and is not determined solely by this list of risks."},{"type":"heading","text":"4. Protective measures for users"},{"type":"p","text":"Users should assess the trustworthiness of their devices and software sources and safeguard passwords, cards and backups. Before deciding whether to send BTC to an address, verify that the backup can be restored and that the private key corresponds to the address actually used to hold BTC. Small-value tests, backups and verification may reduce risk but cannot eliminate it."},{"type":"p","text":"An NFC card is not an unclonable secure element. Wallet notes and public addresses can be read. A note or an address that has not been checked through decryption is not, by itself, proof of the card's origin, authenticity or ownership of its private key."},{"type":"p","text":"Private keys, WIF text and private-key QR-code images are sensitive plaintext information. Do not provide them to the Project Parties, AI services, websites, support personnel or other third parties. When reporting a problem, do not include real private keys, passwords, or screenshots, logs or files containing them."},{"type":"p","text":"A user's failure to take protective measures may affect the occurrence of a loss and the assessment of liability, but this section does not relieve the Project Parties of liability imposed by law."},{"type":"heading","text":"5. Third-party software, websites and modified versions"},{"type":"p","text":"Third-party wallets, block explorers, devices, cards and system services are independently operated by their providers. Links, names and compatibility information do not constitute a warranty by the Project Parties of a third party's security, data accuracy, continued availability or ability to perform its obligations."},{"type":"p","text":"When checking a balance using a third-party explorer, the queried public address, visiting IP address and other information may be received, recorded or associated by that third party. A balance check does not require a private key, seed phrase, decryption password, wallet connection or signature. Users who want the device used to create private keys to remain offline should query public addresses on another device."},{"type":"p","text":"A third party's modification, repackaging, distribution or sale of the software, or its additional service commitments, does not mean that the original Project Parties have authorized it to give warranties, nor does it automatically impose that third party's additional obligations on other contributors. Relevant liability remains subject to applicable law and the facts."},{"type":"heading","text":"6. Limitation of liability"},{"type":"p","text":"**Only to the extent permitted by applicable law and to the extent this limitation is legally valid, and except as otherwise validly agreed in writing by the relevant party, the Project Parties shall not be liable for loss of BTC or other assets, loss of keys or data, recovery costs, lost profits or opportunities, or other direct, indirect, incidental, special or consequential damage arising from use of, inability to use or reliance on the software or related documentation.**"},{"type":"p","text":"Within that scope, this limitation applies to claims based on contract, tort or any other legal theory, including where the possibility of such loss has been communicated."},{"type":"p","text":"**This section must be read together with Section 7. It does not mean that liability for every software defect can be excluded, and it does not require users to waive claims or remedies that cannot legally be waived.**"},{"type":"heading","text":"7. Mandatory legal protections and open-source licenses"},{"type":"p","text":"**This notice does not exclude or limit liability that applicable law prohibits excluding or limiting, including liability for property damage caused intentionally or by gross negligence where such liability cannot legally be excluded, liability for personal injury, and other statutory liability that cannot be excluded or limited.**"},{"type":"p","text":"If any provision is invalid, does not form part of the contract or is unenforceable under applicable law, it shall be dealt with in accordance with that law. Other provisions that can apply independently do not automatically become invalid as a result."},{"type":"p","text":"The software's open-source permissions and conditions are governed by the Apache License 2.0 included in the repository and the respective licenses of third-party components. This notice is a draft risk notice and set of liability terms for application users. It is not an official translation of the Apache License 2.0, does not amend or replace its original text, and does not revoke or impose additional restrictions on the rights to use, copy, modify and distribute that the license already grants."},{"type":"heading","text":"8. Reading and choice"},{"type":"p","text":"Before continuing this operation, confirm that you have read and understood the risks, absence of additional warranties and limitations of liability above. If you disagree, you may exit the operation. If you have questions about important terms, obtain an explanation or professional advice before deciding whether to use the software."},{"type":"p","text":"Clicking “Agree & continue” expresses acceptance of the terms displayed for the current operation. It does not waive rights that cannot legally be waived and does not, by itself, determine ultimate liability in a dispute."}],"ja":[{"type":"p","text":"**コールドウォレットを作成・読み取る前に、特に第2項、第6項、第7項をよくお読みください。本ソフトウェアの使用により、すべてのBTCを永久に失う可能性があります。無料、オープンソース、オフライン利用を前提とした設計、またはテスト済みであることは、欠陥やリスクがないことを意味しません。本案内に同意しない場合は、本アプリの使用を続けないでください。**"},{"type":"heading","text":"1. ソフトウェアの性質とサービスの範囲"},{"type":"p","text":"BitTapは、端末内でBTCの秘密鍵を生成・暗号化・読取・復元し、関連データをNFCカードまたは暗号化ファイルに保存するためのソフトウェアツールです。本案内で「プロジェクト関係者」とは、該当する公式バージョンに関わる著作権者、貢献者および配布者を指します。各当事者の法的地位、権利義務および責任は、実際の事情に基づいて判断されます。"},{"type":"p","text":"本ソフトウェアは無料のオープンソースとして提供されます。その提供によって、プロジェクト関係者がユーザーのBTCや秘密鍵を預かったり、ウォレットを管理したりするものではありません。売買、交換、送金代行、資産保険、利益保証のサービスや投資助言は提供しません。法律に別段の定めがある場合、または該当する当事者が有効な書面による約束をした場合を除き、プロジェクト関係者はユーザーの資産損失を補償する契約上の保証義務を負いません。"},{"type":"heading","text":"2. 現状のままの提供と追加の保証の否認"},{"type":"p","text":"**適用法により義務付けられる場合、または該当する当事者が書面で別途有効に合意した場合を除き、本ソフトウェアおよび関連文書は「現状のまま」かつ「提供可能な状態」で提供され、明示・黙示を問わず、いかなる保証または条件も伴いません。**"},{"type":"p","text":"上記の範囲において、プロジェクト関係者は、プログラムの欠陥、セキュリティ上の脆弱性、互換性の問題がないこと、乱数生成、鍵生成、アドレス導出、暗号化・復号、NFCの読取・書込、バックアップまたは復元がすべての端末・環境で正しく動作することを保証しません。また、特定の目的への適合性、継続的な利用可能性・保守、またはあらゆる資産損失の防止も保証しません。"},{"type":"p","text":"公開ソースコード、テスト結果、安全性の確認、画面の検証メッセージその他の技術情報は、「絶対に安全」「BTCを失わない」「必ず復元できる」ことや、資産価値の保証にはなりません。テストまたは監査の結論は、実際に対象となったバージョンと範囲にのみ適用されます。"},{"type":"heading","text":"3. 全額かつ回復不能な損失の可能性"},{"type":"p","text":"**ユーザーは、本ソフトウェアの使用、使用不能または誤使用により、BTCの一部または全部を失い、回復できなくなる可能性があることを理解する必要があります。**リスクには、以下が含まれますが、これらに限られません。"},{"type":"list","items":["本ソフトウェア、依存ライブラリ、暗号実装の欠陥、または端末の乱数源、OS、ファームウェア、ハードウェアの問題。","スマートフォンへの侵入、マルウェア、入力システム、クリップボード、画面録画、スクリーンショット、同期・バックアップ機能を通じた機密情報の漏えい。","パスワードの紛失や強度不足、秘密鍵の漏えい、または第三者による平文秘密鍵・秘密鍵QRコード画像の取得。","NFCカードの複製、改ざん、破損、紛失、またはデータの書込、再読取、書出し、保存、読取の失敗。","受取アドレスの誤り、アドレス形式の不一致、移行先ウォレットの非互換、または未検証バックアップの使用。","第三者によるソフトウェアの改変、偽のインストールパッケージ、不正なウェブサイト、フィッシング、ソーシャルエンジニアリング、第三者サービスの障害。"]},{"type":"p","text":"プロジェクト関係者は通常、復号パスワードの再設定、紛失した秘密鍵の復元、オンチェーン取引の取消し、盗難・誤送金されたBTCの回収を行えません。最終的な法的責任は、適用法、具体的な事実および有効な合意に基づいて判断され、このリスクの列挙だけで決まるものではありません。"},{"type":"heading","text":"4. ユーザーが講じるべき保護措置"},{"type":"p","text":"ユーザーは端末とソフトウェアの入手元の信頼性を評価し、パスワード、カード、バックアップを適切に保管してください。アドレスへのBTC送付を判断する前に、バックアップから復元できること、秘密鍵が実際にBTCを保管するアドレスと一致することを確認してください。少額でのテスト、バックアップ、検証はリスクを減らすことができますが、なくすことはできません。"},{"type":"p","text":"NFCカードは複製不能なセキュアエレメントではありません。ウォレットのメモと公開アドレスは読み取られる可能性があり、メモや復号による照合をしていないアドレスだけでは、カードの出所・真正性や秘密鍵の帰属を確認できません。"},{"type":"p","text":"秘密鍵、WIFテキスト、秘密鍵QRコード画像は、機密性の高い平文情報です。プロジェクト関係者、AIサービス、ウェブサイト、サポート担当者その他の第三者に提供しないでください。問題を報告する際も、実際の秘密鍵、パスワード、またはそれらを含むスクリーンショット、ログ、ファイルを添付しないでください。"},{"type":"p","text":"保護措置を講じなかったことは、損失の発生や責任の判断に影響する可能性がありますが、本項はプロジェクト関係者が法律上負う責任を免除するものではありません。"},{"type":"heading","text":"5. 第三者のソフトウェア・サイト・改変版"},{"type":"p","text":"第三者のウォレット、ブロックエクスプローラー、端末、カード、システムサービスは、それぞれの提供者が独立して運営します。リンク、名称、互換性の説明は、第三者の安全性、データの正確性、継続的な利用可能性、義務履行能力について、プロジェクト関係者が保証するものではありません。"},{"type":"p","text":"第三者のエクスプローラーで残高を照会すると、照会対象の公開アドレス、アクセス元IPなどの情報が第三者に受信・記録・関連付けされる可能性があります。残高照会には、秘密鍵、シードフレーズ、復号パスワード、ウォレット接続、署名は不要です。秘密鍵を作成する端末をオフラインに保ちたい場合は、別の端末で公開アドレスを照会してください。"},{"type":"p","text":"第三者によるソフトウェアの改変、再パッケージ化、配布、販売、追加のサービス上の約束は、元のプロジェクト関係者がその保証を承認したことを意味せず、他の貢献者に当該第三者の追加義務を自動的に負わせるものでもありません。関連する責任は、適用法および事実に基づいて判断されます。"},{"type":"heading","text":"6. 責任の制限"},{"type":"p","text":"**適用法が認め、本項の責任制限が法的に有効な範囲に限り、かつ該当する当事者が書面で別途有効に合意した場合を除き、プロジェクト関係者は、本ソフトウェア・関連文書の使用、使用不能またはそれらへの依拠から生じるBTCその他の資産の損失、鍵・データの喪失、復元費用、利益・機会の喪失、その他の直接的、間接的、付随的、特別または結果的な損害について、賠償責任を負いません。**"},{"type":"p","text":"上記の範囲において、この制限は、契約、不法行為その他の法的根拠による請求に適用され、そのような損失の可能性を知らされていた場合にも適用されます。"},{"type":"p","text":"**本項は必ず第7項と併せて理解してください。すべてのソフトウェアの欠陥について免責されることを意味せず、法律上放棄できない請求権や救済をユーザーに放棄させるものでもありません。**"},{"type":"heading","text":"7. 法律上の権利・責任の留保とオープンソースライセンス"},{"type":"p","text":"**本案内は、適用法が除外・制限を禁じる責任を除外・制限しません。これには、法律上免除できない故意または重大な過失による財産損害の責任、人身損害の責任、その他除外・制限できない法定責任が含まれます。**"},{"type":"p","text":"いずれかの条項が適用法により無効となり、契約の内容とならず、または執行不能となる場合は、法律に従って取り扱われます。独立して適用できる他の条項が、それだけで当然に無効となるものではありません。"},{"type":"p","text":"本ソフトウェアのオープンソースとしての許諾範囲と条件は、リポジトリに同梱されるApache License 2.0および各第三者コンポーネントのライセンスに従います。本案内はアプリ利用者向けのリスク説明・責任条項の草案であり、Apache License 2.0の公式訳ではありません。その原文を変更・置換せず、同ライセンスが既に許諾する使用、複製、改変、配布の権利を撤回したり、追加で制限したりするものではありません。"},{"type":"heading","text":"8. 閲読と選択"},{"type":"p","text":"今回の操作を続ける前に、上記のリスク、追加保証の否認、責任制限を読み、理解したことを確認してください。同意しない場合は操作を終了できます。重要な条項に疑問がある場合は、説明または専門家の助言を受けてから、使用するかどうか判断してください。"},{"type":"p","text":"「同意して続ける」の選択は、今回の操作で表示された条項への同意を示すためのものです。法律上放棄できない権利を放棄するものではなく、紛争における最終的な責任をそれだけで決めるものでもありません。"}],"ko":[{"type":"p","text":"**콜드월렛을 만들거나 읽기 전에 이 안내, 특히 제2항, 제6항, 제7항을 주의 깊게 읽어 주세요. 소프트웨어 사용으로 BTC 전부를 영구적으로 잃을 수 있습니다. 무료, 오픈소스, 오프라인 사용을 위한 설계 또는 테스트 완료가 결함이나 위험이 없다는 뜻은 아닙니다. 동의하지 않으면 앱 사용을 계속하지 마세요.**"},{"type":"heading","text":"1. 소프트웨어의 성격과 서비스 범위"},{"type":"p","text":"BitTap은 기기 안에서 BTC 개인키를 생성·암호화·읽기·복구하고, 관련 데이터를 NFC 카드 또는 암호화 파일에 저장하기 위한 소프트웨어 도구입니다. 이 안내의 “프로젝트 관계자”란 해당 공식 버전과 관련된 저작권자, 기여자 및 배포자를 뜻합니다. 각 당사자의 법적 지위, 권리·의무 및 책임은 실제 사정에 따라 판단됩니다."},{"type":"p","text":"이 소프트웨어는 무료 오픈소스로 제공됩니다. 소프트웨어를 제공한다는 이유로 프로젝트 관계자가 사용자의 BTC나 개인키를 대신 보관하거나 월렛을 관리하는 것은 아닙니다. 매매, 교환, 송금 대행, 자산 보험, 수익 보장 서비스 또는 투자 조언을 제공하지 않습니다. 법률에 달리 정함이 있거나 해당 당사자가 유효한 서면 약속을 한 경우를 제외하고, 프로젝트 관계자는 사용자의 자산 손실을 보상할 계약상 보증 의무를 부담하지 않습니다."},{"type":"heading","text":"2. 현 상태 제공 및 추가 보증의 부인"},{"type":"p","text":"**적용 법률이 요구하거나 해당 당사자가 서면으로 달리 유효하게 합의한 경우를 제외하고, 소프트웨어와 관련 문서는 “현 상태” 및 “제공 가능한 상태”로 제공되며 명시적이든 묵시적이든 어떠한 보증이나 조건도 수반하지 않습니다.**"},{"type":"p","text":"위 범위에서 프로젝트 관계자는 프로그램 결함, 보안 취약점 또는 호환성 문제가 없음을 보장하지 않습니다. 난수 생성, 키 생성, 주소 도출, 암호화·복호화, NFC 읽기·쓰기, 백업 또는 복구가 모든 기기와 환경에서 올바르게 작동함을 보장하지 않으며, 특정 목적에의 적합성, 지속적인 이용 가능성·유지보수 또는 모든 자산 손실의 방지를 보장하지 않습니다."},{"type":"p","text":"공개 소스코드, 테스트 결과, 보안 점검, 화면의 검증 메시지 또는 기타 기술 정보는 “절대적 안전”, “BTC 손실 없음”, “복구 성공 보장” 또는 자산 가치의 보증이 아닙니다. 테스트나 감사의 결론은 실제로 검토한 버전과 범위에만 적용됩니다."},{"type":"heading","text":"3. 전액 및 회복 불가능한 손실의 가능성"},{"type":"p","text":"**사용자는 소프트웨어의 사용, 사용 불능 또는 잘못된 사용으로 BTC 일부 또는 전부를 잃고 복구하지 못할 수 있음을 이해해야 합니다.** 위험에는 다음이 포함되지만 이에 한정되지 않습니다."},{"type":"list","items":["소프트웨어, 의존 라이브러리 또는 암호 구현의 결함, 기기의 난수원·운영체제·펌웨어·하드웨어 문제.","휴대전화 침해, 악성 소프트웨어, 입력기, 클립보드, 화면 녹화, 스크린샷, 동기화·백업 기능을 통한 민감 정보 노출.","비밀번호 분실이나 취약한 비밀번호, 개인키 유출, 제3자의 평문 개인키 또는 개인키 QR 코드 이미지 취득.","NFC 카드 복제·변조·손상·분실, 데이터 쓰기·다시 읽기·내보내기·저장·읽기 실패.","잘못된 받는 주소, 주소 유형 불일치, 대상 월렛의 비호환 또는 검증하지 않은 백업 사용.","제3자의 소프트웨어 수정, 위조 설치 패키지, 악성 웹사이트, 피싱, 사회공학 공격 또는 제3자 서비스 장애."]},{"type":"p","text":"프로젝트 관계자는 일반적으로 복호화 비밀번호를 재설정하거나 분실한 개인키를 재구성하거나 온체인 거래를 취소하거나 도난·오송금된 BTC를 회수할 수 없습니다. 최종 법적 책임은 적용 법률, 구체적인 사실 및 유효한 합의에 따라 판단되며, 위 위험 목록만으로 결정되지 않습니다."},{"type":"heading","text":"4. 사용자가 취해야 할 보호 조치"},{"type":"p","text":"사용자는 기기와 소프트웨어 입수 경로의 신뢰성을 평가하고 비밀번호, 카드, 백업을 안전하게 보관해야 합니다. 주소로 BTC를 보낼지 결정하기 전에 백업에서 복구할 수 있는지, 개인키가 실제 BTC 보관 주소와 일치하는지 확인하세요. 소액 테스트, 백업 및 검증은 위험을 줄일 수 있지만 없앨 수는 없습니다."},{"type":"p","text":"NFC 카드는 복제 불가능한 보안 칩이 아닙니다. 월렛 메모와 공개 주소는 읽힐 수 있으므로 메모 또는 복호화를 통한 대조를 하지 않은 주소만으로 카드의 출처·진위나 개인키의 귀속을 확인할 수 없습니다."},{"type":"p","text":"개인키, WIF 텍스트, 개인키 QR 코드 이미지는 민감한 평문 정보입니다. 프로젝트 관계자, AI 서비스, 웹사이트, 고객 지원 담당자 또는 기타 제3자에게 제공하지 마세요. 문제를 신고할 때에도 실제 개인키, 비밀번호 또는 이를 포함한 스크린샷·로그·파일을 첨부하지 마세요."},{"type":"p","text":"보호 조치를 취하지 않은 사실은 손실 발생과 책임 판단에 영향을 줄 수 있지만, 이 항은 프로젝트 관계자가 법률상 부담해야 하는 책임을 면제하지 않습니다."},{"type":"heading","text":"5. 제3자 소프트웨어·웹사이트·수정 버전"},{"type":"p","text":"제3자 월렛, 블록 탐색기, 기기, 카드 및 시스템 서비스는 각 제공자가 독립적으로 운영합니다. 링크, 명칭 또는 호환성 설명은 프로젝트 관계자가 제3자의 보안, 데이터 정확성, 지속적인 이용 가능성 또는 의무 이행 능력을 보증한다는 뜻이 아닙니다."},{"type":"p","text":"제3자 탐색기로 잔액을 조회하면 조회한 공개 주소, 접속 IP 등의 정보를 제3자가 수신·기록·연결할 수 있습니다. 잔액 조회에는 개인키, 시드 문구, 복호화 비밀번호, 월렛 연결 또는 서명이 필요하지 않습니다. 개인키를 만드는 기기를 오프라인으로 유지하려면 다른 기기에서 공개 주소를 조회하세요."},{"type":"p","text":"제3자의 소프트웨어 수정·재패키징·배포·판매 또는 추가 서비스 약속은 원래 프로젝트 관계자가 해당 보증을 승인했다는 뜻이 아니며, 다른 기여자에게 그 제3자의 추가 의무를 자동으로 부담시키지도 않습니다. 관련 책임은 적용 법률과 사실에 따라 판단됩니다."},{"type":"heading","text":"6. 책임 제한"},{"type":"p","text":"**적용 법률이 허용하고 이 책임 제한이 법적으로 유효한 범위에서만, 그리고 해당 당사자가 서면으로 달리 유효하게 합의한 경우를 제외하고, 프로젝트 관계자는 소프트웨어·관련 문서의 사용, 사용 불능 또는 이에 대한 의존으로 발생하는 BTC나 기타 자산의 손실, 키·데이터 손실, 복구 비용, 이익·기회 상실 또는 기타 직접적·간접적·부수적·특별·결과적 손해에 대해 배상 책임을 지지 않습니다.**"},{"type":"p","text":"위 범위에서 이 제한은 계약, 불법행위 또는 기타 법적 근거에 따른 청구에 적용되며, 해당 손실의 가능성을 통지받은 경우에도 적용됩니다."},{"type":"p","text":"**이 항은 반드시 제7항과 함께 이해해야 합니다. 모든 소프트웨어 결함에 대한 책임이 면제된다는 뜻이 아니며, 법률상 포기할 수 없는 청구권이나 구제 수단을 사용자에게 포기하도록 요구하지 않습니다.**"},{"type":"heading","text":"7. 법정 권리·책임의 유보 및 오픈소스 라이선스"},{"type":"p","text":"**이 안내는 적용 법률이 배제·제한을 금지하는 책임을 배제하거나 제한하지 않습니다. 여기에는 법률상 면제할 수 없는 고의 또는 중대한 과실로 인한 재산 손해 책임, 신체 손해 책임 및 기타 배제·제한할 수 없는 법정 책임이 포함됩니다.**"},{"type":"p","text":"어떤 조항이 적용 법률에 따라 무효이거나 계약 내용이 되지 않거나 집행할 수 없는 경우에는 해당 법률에 따라 처리합니다. 독립적으로 적용할 수 있는 다른 조항이 그 이유만으로 자동으로 무효가 되는 것은 아닙니다."},{"type":"p","text":"소프트웨어의 오픈소스 이용 허락 범위와 조건은 저장소에 포함된 Apache License 2.0 및 각 제3자 구성요소의 라이선스에 따릅니다. 이 안내는 앱 사용자용 위험 설명과 책임 조항의 초안이며 Apache License 2.0의 공식 번역이 아닙니다. 해당 원문을 수정·대체하지 않으며, 라이선스가 이미 부여한 사용·복제·수정·배포 권리를 철회하거나 추가로 제한하지 않습니다."},{"type":"heading","text":"8. 읽기 및 선택"},{"type":"p","text":"이번 작업을 계속하기 전에 위 위험, 추가 보증의 부인 및 책임 제한을 읽고 이해했는지 확인하세요. 동의하지 않으면 작업을 종료할 수 있습니다. 중요한 조항에 의문이 있으면 설명이나 전문가 의견을 구한 후 사용 여부를 결정하세요."},{"type":"p","text":"“동의하고 계속”을 누르는 것은 이번 작업에서 표시된 조항에 대한 동의를 나타냅니다. 법률상 포기할 수 없는 권리를 포기하는 것이 아니며, 분쟁의 최종 책임을 그 자체만으로 결정하지 않습니다."}]};

    const securityContent={"title":"BitTap 如何保护你的私钥？","intro":"BTC 记录在比特币区块链上，NFC 卡片保存的是加密后的私钥备份。私钥决定谁能控制对应的 BTC，密码则用于保护这份备份。","sections":[{"title":"1. 标准模式：使用手机的安全随机源","paragraphs":["每次创建钱包，BitTap 都从安卓系统的安全随机源取得新的随机数据，并检查是否符合比特币私钥的有效范围。不符合要求就重新生成；随机源报错时停止操作，不改用时间戳等弱随机方式。","你的密码、钱包备注或创建时间，都不是生成私钥的依据。密码负责保护私钥，不决定私钥是什么。"]},{"title":"2. 增强模式：加入相机输入，保留系统随机源（下一版设计文案）","paragraphs":["开启增强模式后，BitTap 会在你移动相机时采集部分预览画面，并拍摄最终照片。应用通过 SHA-256 将这些数据整理成摘要，再与安卓安全随机数据通过 HMAC-SHA256 混合，用于生成私钥。","可以把它理解为：在系统随机数之外，再加入一份来自相机的输入。它不是只靠照片生成钱包，也不是用照片代替系统随机源。系统随机源报错时停止生成；相机采集失败时，不会假装增强成功，用户可以重试或明确切回标准模式。","采集图像只在本次操作的内存中处理，不自动保存到相册、不上传；生成完成或取消时，清理本应用持有的照片、画面摘要和混合中间数据。照片不是密码，恢复钱包不需要保留照片或重拍同一场景。","SHA-256 不会凭空创造随机性，相机输入也不代表已证明增加了多少位安全性。增强模式不能保护已经被入侵的手机。"]},{"title":"3. 收款地址按比特币规则从密钥推导","paragraphs":["BitTap 按比特币的密码学规则，从同一份密钥材料推导 SegWit、Legacy、P2SH 和 Taproot 四种收款地址。它们共用同一份原始私钥材料，余额分别记录。","公开地址用于收款和查询，不是私钥，也不能代替私钥转走 BTC。"]},{"title":"4. 先处理密码，再为私钥加密","paragraphs":["BitTap 不直接把输入的密码当作加密密钥，而是通过 scrypt，加上每次新生成的随机“盐”，得到用于加密的密钥。你可以把它理解为：让每次猜测密码都需要消耗额外的计算和内存资源，提高批量猜密码的成本。","随后使用 AES-256-GCM 加密私钥。这一方式既保护私钥内容，也对密文和受保护的地址信息进行完整性校验；数据被改动时，校验会失败。每次加密使用新的随机参数，密码本身不存入卡片或备份文件。"]},{"title":"5. 生成、写卡和解密时，都有对应的校验","paragraphs":["生成后，BitTap 会立即尝试解密刚产生的备份，确认恢复出的私钥与原私钥一致；写卡后，再读回核对写入的数据。","日后解密时，还会从恢复的私钥重新推导收款地址，与卡片记录逐项核对。只有通过后，才显示“已与私钥核对，地址正确”。没有输入密码时看到的地址，只是卡片中公开保存的地址，尚未完成这一步验证。","这些检查能发现所覆盖的错误，但不构成没有软件缺陷或绝不丢币的保证，也不能证明整张卡片的来源。"]},{"title":"6. 明文私钥用完即清理，制作完成后清理本次会话","paragraphs":["生成、加密并完成恢复校验后，应用就清理本次生成操作持有的明文私钥。**这一步发生在进入写卡页面之前，不需要等到卡片写完。**用于加密的派生密钥和本次操作的密码缓冲，也会在各自使用结束后清理。","后续写入 NFC 卡片、保存加密备份和制作同一钱包的其他卡片，使用的是加密数据及公开地址，不需要一直保留明文私钥。","写卡后，应用会读回核对。为了让你完成必需的文件备份，或继续写入另一张 NFC 卡，本次加密数据会暂时保留在操作会话中。**完成备份并点击“完成，返回首页”后，应用再清理本次会话中的加密数据、地址和相关界面状态，不在应用内建立钱包历史列表。**","你主动写入的 NFC 卡片、保存到外部位置的加密备份，以及另行导出的文件或图片，不会随着返回首页而被删除。清理的是应用当前会话，不是用户保存的恢复材料。"]},{"title":"7. 卡片被复制，不等于私钥已经被解密","paragraphs":["复制者能够取得公开地址和加密备份，但在正常实现、设备可信且密码足够强的前提下，无法仅靠复制卡片直接读取明文私钥。","不过，复制者可以离线反复猜密码，因此密码越短、越常见，风险越高。scrypt 能提高猜测成本，不能把弱密码变成强密码。请使用独立长密码，并与卡片分开保管；忘记密码且没有其他有效恢复材料时，项目方无法重置密码或找回 BTC。"]},{"title":"8. 密钥处理在本机完成，手机本身仍需可信","paragraphs":["私钥生成、加密和解密在本机进行，不需要把私钥或密码交给服务器。解密读取已有钱包时，明文私钥必须暂时存在于应用内存中，即使界面默认隐藏也不等于内存中没有私钥；返回首页时，应用会清理当前会话持有的私钥、密码和相关数据。","这不代表操作系统或第三方组件中的所有副本都能被证明彻底擦除，也不能抵御已经被入侵的手机。NFC 卡片是加密备份载体，不具备专用硬件钱包的独立签名与密钥隔离能力。"]}],"related":[{"title":"Bitcoin Core","text":"使用强随机数生成合法密钥，并提供本地钱包的密码加密。BitTap 没有直接使用 Bitcoin Core 的随机数实现；Core 的钱包加密实现包含 AES-256-CBC，不能说两者加密流程相同。"},{"title":"Electrum","text":"用密码加密种子或私钥等敏感材料，需要使用时才解密。Electrum 的种子和私钥使用 AES-256-CBC，钱包文件另有加密层；BitTap 当前采用 scrypt + AES-256-GCM，是独立私钥备份，格式不同。"},{"title":"SeedSigner · 增强模式的参考","text":"其相机熵方案会使用预览帧和最终照片等数据。BitTap 相机增强尚未实现，规划为保留安卓安全随机源，再混合相机输入。不能宣称已采用同一算法或具有相同安全性。"}],"caution":"相近的是设计思路，不代表代码相同、安全性相同、格式兼容，或得到这些项目的认证与背书。","compatibility":"BitTap 当前生成的 CG2 加密备份是项目自定义格式，不是 BIP38，也不能直接作为 Bitcoin Core 或 Electrum 的钱包文件使用。需要先用 BitTap 或离线恢复工具解密，再将 BTC 主网压缩 WIF 私钥导入支持该格式及对应地址类型的钱包。"};

    // Dedicated WIF help. Wallet import support checked against official docs and source.
    const transferCopy={
      zh:{format:'WIF 私钥是什么？',formatBody:'WIF（Wallet Import Format）是便于钱包导入的私钥文本格式。BitTap 导出 BTC 主网的压缩 WIF 私钥；它是明文私钥，不是助记词或加密备份。持有它的人可以转走对应地址的 BTC。',wallets:'哪些钱包可以导入？',electrum:'新建“导入私钥”的钱包。SegWit、P2SH 需要指定相应地址类型，不能直接加入已有助记词钱包。',blue:'在“添加钱包 → 导入钱包”中输入 WIF，或扫描私钥二维码；导入后核对实际存币地址。',compatibility:'先核对完整收款地址',compatibilityBody:'WIF 本身不标明地址类型。请确认导入后的地址与实际存币地址完全一致；余额不符时，检查地址类型与同步状态。Taproot（bc1p）需单独确认目标钱包版本的恢复兼容性。',safety:'导入后，尽快转入新钱包',safetyBody:'将全部 BTC 转入已备份的新钱包，确认到账后停止使用旧地址。私钥和私钥二维码切勿发给 AI、网站或他人。',source:'仅从官方网站获取钱包。支持 WIF 不代表已通过 BitTap 的实机恢复验证。'},
      en:{format:'What is a WIF private key?',formatBody:'WIF (Wallet Import Format) encodes a private key as text for importing into a wallet. BitTap exports compressed Bitcoin-mainnet WIF. It is an unencrypted private key, not a seed phrase or encrypted backup. Anyone with it can spend BTC from the corresponding addresses.',wallets:'Which wallets can import it?',electrum:'Create a wallet for imported private keys. SegWit and P2SH require the appropriate address type; keys cannot be added to an existing seed wallet.',blue:'Choose Add wallet → Import wallet, then enter the WIF or scan its QR. Check the actual funded address after importing.',compatibility:'Match the full receiving address',compatibilityBody:'WIF does not identify the address type. The imported address must exactly match the funded address. If the balance differs, check the address type and sync status. For Taproot (bc1p), separately confirm recovery support in your wallet version.',safety:'Move funds to a new wallet promptly',safetyBody:'Send all BTC to a new, backed-up wallet. Stop receiving at the old address after confirmation. Never share the private key or its QR with AI, websites or other people.',source:'Get wallets only from their official sites. WIF support is not confirmation of a BitTap recovery test on a real device.'},
      ja:{format:'WIF形式の秘密鍵とは？',formatBody:'WIF（Wallet Import Format）は、ウォレットに取り込める文字列で秘密鍵を表す形式です。BitTapはBTCメインネット用の圧縮WIFを出力します。暗号化されていない秘密鍵であり、シードフレーズや暗号化バックアップではありません。入手した人は対応するアドレスのBTCを送金できます。',wallets:'取り込みに対応するウォレット',electrum:'秘密鍵をインポートする専用ウォレットを新規作成します。SegWit・P2SHはアドレス種類の指定が必要です。既存のシード付きウォレットには追加できません。',blue:'「ウォレットを追加 → インポート」でWIFを入力するか、秘密鍵QRを読み取ります。取り込み後、実際にBTCを保管しているアドレスを確認してください。',compatibility:'受取アドレス全体を照合',compatibilityBody:'WIF自体にはアドレスの種類が含まれません。取り込み後のアドレスが実際の保管先と完全に一致することを確認してください。残高が異なる場合は、種類と同期状況を確認します。Taproot（bc1p）は使用バージョンでの復元互換性を別途確認してください。',safety:'新しいウォレットへ速やかに送金',safetyBody:'バックアップ済みの新しいウォレットへ全BTCを移し、着金確認後は旧アドレスで受け取らないでください。秘密鍵やそのQRをAI、ウェブサイト、他人に渡さないでください。',source:'ウォレットは公式サイトから入手してください。WIF対応はBitTapの実機復元検証済みを意味しません。'},
      ko:{format:'WIF 개인키란?',formatBody:'WIF(Wallet Import Format)는 월렛으로 가져올 수 있도록 개인키를 문자열로 표현한 형식입니다. BitTap은 BTC 메인넷용 압축 WIF를 내보냅니다. 암호화되지 않은 개인키이며 시드 문구나 암호화 백업이 아닙니다. 이를 가진 사람은 해당 주소의 BTC를 전송할 수 있습니다.',wallets:'가져오기를 지원하는 월렛',electrum:'개인키 가져오기용 월렛을 새로 만드세요. SegWit·P2SH는 알맞은 주소 유형을 지정해야 하며 기존 시드 월렛에 키를 추가할 수 없습니다.',blue:'월렛 추가 → 월렛 가져오기에서 WIF를 입력하거나 개인키 QR을 스캔하세요. 가져온 후 실제 BTC 보관 주소를 확인하세요.',compatibility:'받는 주소 전체를 대조하세요',compatibilityBody:'WIF 자체에는 주소 유형이 표시되지 않습니다. 가져온 주소가 실제 BTC 보관 주소와 정확히 같아야 합니다. 잔액이 다르면 주소 유형과 동기화 상태를 확인하세요. Taproot(bc1p)는 해당 월렛 버전의 복구 호환성을 별도로 확인해야 합니다.',safety:'새 월렛으로 신속하게 옮기세요',safetyBody:'백업을 마친 새 월렛으로 모든 BTC를 보내고 입금 확인 후 기존 주소로 받지 마세요. 개인키와 개인키 QR을 AI, 웹사이트 또는 다른 사람에게 제공하지 마세요.',source:'공식 사이트에서만 월렛을 받으세요. WIF 지원이 BitTap의 실제 기기 복구 검증을 의미하지는 않습니다.'}

    Object.assign(transferCopy.zh,{okx:'在 OKX Web3 钱包中选择私钥导入，输入 WIF。用户实测反馈：SegWit、Legacy、P2SH、Taproot 四种地址均恢复一致。',source:'OKX 的四种地址恢复结果来自用户实测反馈；Electrum、BlueWallet 依据官方文档与源码确认导入支持。兼容性可能随版本变化，请核对完整地址，并仅从官方网站获取钱包。'});

    Object.assign(transferCopy.ja,{okx:'OKX Web3 Walletで秘密鍵のインポートを選び、WIFを入力します。ユーザーの実機テスト報告では、SegWit・Legacy・P2SH・Taprootの4種類すべてのアドレスが一致しました。',source:'OKXの4種類の復元結果はユーザーのテスト報告です。ElectrumとBlueWalletは公式資料とソースで取り込み対応を確認しています。互換性はバージョンで異なる場合があります。アドレス全体を照合し、公式サイトから入手してください。'});
    Object.assign(transferCopy.ko,{okx:'OKX Web3 월렛에서 개인키 가져오기를 선택하고 WIF를 입력하세요. 사용자 실기기 테스트 보고에 따르면 SegWit·Legacy·P2SH·Taproot 네 가지 주소가 모두 일치하게 복구되었습니다.',source:'OKX의 네 가지 주소 복구 결과는 사용자 테스트 보고입니다. Electrum·BlueWallet은 공식 문서와 소스에서 가져오기 지원을 확인했습니다. 버전에 따라 호환성이 달라질 수 있으므로 전체 주소를 대조하고 공식 사이트에서만 월렛을 받으세요.'});
    // NXP NTAG213/215/216 user-memory specifications; actual NDEF capacity is checked per tag.
    const cardHelpCopy={
      zh:{prep:'请先准备一张兼容、可写入的 NFC 卡片。',view:'查看支持卡片',title:'支持哪些 NFC 卡片？',rows:[['nfc','优先选择 NTAG216','NTAG216：888 字节用户区，优先推荐。NTAG215：504 字节用户区，需通过实际容量检查。NTAG213：144 字节用户区，无法容纳本工具的钱包数据。'],['scan-line','格式与最低容量','卡片须已格式化为 NDEF、可写且容量足够。最低所需容量取决于本次完整钱包数据，程序会在写入前检查。芯片用户区大小不等于实际可用的 NDEF 容量。'],['refresh-cw','支持重复写入，但会覆盖原内容','兼容且未锁定的卡片可以重复使用。卡片已有数据时会先提示确认；写入会替换原有全部 NDEF 内容，请先保留需要的数据。'],['circle-help','这些情况无法直接写入','只读、永久锁定、容量不足，或未格式化为 NDEF 的卡片无法直接写入，本工具不自动格式化。能被手机感应不代表兼容；不要使用日常银行卡、交通卡或门禁卡尝试覆盖。']],phone:'请使用支持 NFC 的安卓手机，并开启 NFC。'},
      en:{prep:'Prepare a compatible, writable NFC card before continuing.',view:'View supported cards',title:'Which NFC cards can I use?',rows:[['nfc','Prefer NTAG216','NTAG216: 888 bytes of user memory; preferred. NTAG215: 504 bytes; must pass the actual capacity check. NTAG213: 144 bytes; too small for this tool’s wallet data.'],['scan-line','Format and minimum capacity','The card must already be NDEF-formatted, writable and large enough. The minimum depends on this wallet’s complete data and is checked before writing. Chip user memory is not the same as usable NDEF capacity.'],['refresh-cw','Reusable cards overwrite old contents','Compatible, unlocked cards can be written again. Existing data requires confirmation; writing replaces all NDEF contents. Keep any data you still need first.'],['circle-help','Cards that cannot be written directly','Read-only, permanently locked, undersized or non-NDEF cards cannot be written directly. This tool does not format them automatically. Detection alone does not prove compatibility. Do not try to overwrite everyday bank, transit or access cards.']],phone:'Use an NFC-capable Android phone with NFC enabled.'},
      ja:{prep:'先に、対応する書き込み可能なNFCカードを用意してください。',view:'対応カードを見る',title:'利用できるNFCカードは？',rows:[['nfc','NTAG216を優先','NTAG216：ユーザー領域888バイト、優先推奨。NTAG215：504バイト、実際の容量チェックが必要です。NTAG213：144バイト、本ツールのウォレットデータは収まりません。'],['scan-line','形式と必要容量','NDEF形式に設定済みで、書き込み可能かつ十分な容量のあるカードが必要です。最低必要容量は今回のウォレットデータ全体により異なり、書き込み前に確認します。ユーザー領域の大きさと利用可能なNDEF容量は異なります。'],['refresh-cw','再利用時は内容を上書き','対応するロックされていないカードは繰り返し使えます。既存データがある場合は確認を求め、NDEFの全内容を置き換えます。必要なデータは先に保存してください。'],['circle-help','そのまま書き込めないカード','読み取り専用、永久ロック、容量不足、NDEF未設定のカードには直接書き込めません。自動フォーマットは行いません。検出できても対応とは限りません。日常の銀行・交通・入退室カードを上書きしないでください。']],phone:'NFC対応のAndroid端末で、NFCを有効にしてください。'},

      else if(a==='backSecurity'){v.screen=v.securityReturn?.screen||'home';v.sheet=v.securityReturn?.sheet||'about';v.securityReturn=null;}
      else if(a==='fullDisclaimer'){v.beforeTerms=v.screen;v.screen='terms';v.sheet=null;}
      else if(a==='backDisclaimer'){v.screen=v.beforeTerms||'home';v.sheet='disclaimer';v.beforeTerms=null;}
      else if(a==='agree'){v.screen=v.pending||'home';v.sheet=null;v.pending=null;if(v.screen==='setup'){v.backup=false;v.duplicate=false;v.lockAfterWrite=false;v.lockStatus='';}}
      else if(a==='disagree'){v.screen='home';v.sheet=null;v.pending=null;}
      else if(a==='language'||a==='principle'||a==='about'||a==='addresses'||a==='transferHelp'||a==='cardHelp')v.sheet=a;
      else if(a==='address'){v.addressIndex=0;v.fromList=false;v.sheet='address';}
      else if(a.startsWith('view-')){v.addressIndex=Number(a.slice(5));v.fromList=true;v.sheet='address';}
      else if(a==='close'){if(v.sheet==='confirmReadOnly'){v.lockStatus='unprotected';v.sheet=null;}else if(v.sheet==='lockscan'){v.lockStatus='unknown';v.sheet='lockIssue';}else if(v.sheet==='address'&&v.fromList){v.sheet='addresses';v.fromList=false;}else if(v.sheet==='confirmPrivateSave')v.sheet='privateqr';else if(v.sheet==='explorers')v.sheet='address';else v.sheet=null;}
      else if(a==='demoPrivate'){v.sheet='privateqr';v.fromList=false;}
      else if(a==='savePrivate'){v.sheet='confirmPrivateSave';}
      else if(a==='backPrivateQr'){v.sheet='privateqr';}
      else if(a==='explorers'){v.sheet='explorers';}
      else if(a==='backAddress'){v.sheet='address';}
      else if(a.startsWith('explorer-')){v.pass='';v.confirm='';v.privateVisible=false;if(v.screen==='revealed')v.screen='unlock';toast(v,'explorerDemo');persist();return;}
      else if(a==='saveQr'){if(v.sheet==='confirmPrivateSave')v.sheet='privateqr';toast(v,'saveDemo');persist();return;}
      else if(a==='home'){v.screen='home';v.sheet=null;v.privateVisible=false;v.backup=false;v.duplicate=false;v.lockAfterWrite=false;v.lockStatus='';v.cameraReady=false;v.pass='';v.confirm='';}
      else if(a==='back'){
        if(v.screen==='camera'||v.screen==='review'){v.screen='setup';v.sheet=null;v.pass='';v.confirm='';}
        else if(['write','complete'].includes(v.screen)&&!v.backup){v.sheet='backup';v.afterBackup='home';}
        else if(v.screen==='revealed'){v.screen='unlock';v.privateVisible=false;}
        else {v.screen='home';v.sheet=null;}
      }
      else if(a==='generate'){
        const normalized=v.note.normalize('NFC');
        if(Array.from(normalized).length>16||new TextEncoder().encode(normalized).length>64||!/^[\p{L}\p{N}\p{M} .,，。!！?？:：;；、_\-()（）\[\]【】'"+/#&@·]*$/u.test(normalized)){v.error=t(v,'invalidRemark');}
        else if(v.enhanced&&!v.cameraReady){v.note=normalized;v.sheet='permission';}
        else if(v.pass.length<6||v.pass!==v.confirm||!v.pass.trim()){v.error=t(v,'invalidPassword');}
        else{v.note=normalized;v.screen='write';v.sheet=null;v.cameraReady=false;v.pass='';v.confirm='';}
      }
      else if(a==='allow'){v.sheet=v.cameraCase==='权限未授权'?'denied':null;if(!v.sheet)v.screen='camera';}
      else if(a==='retryCamera'){if(v.sheet==='denied')v.sheet='permission';else{v.sheet=null;v.screen='camera';}}
      else if(a==='capture'){if(v.cameraCase==='采集失败')v.sheet='failed';else v.screen='review';}
      else if(a==='retake'){v.screen='camera';v.sheet=null;v.cameraReady=false;}
      else if(a==='mix'){v.screen='setup';v.sheet=null;v.cameraReady=true;v.pass='';v.confirm='';}
      else if(a==='standard'){v.enhanced=false;v.cameraReady=false;v.sheet=null;v.screen='setup';}
      else if(a==='cancelCamera'){v.screen='setup';v.sheet=null;v.cameraReady=false;v.pass='';v.confirm='';}
      else if(a==='write'){v.sheet='writescan';}
      else if(a==='scan'){v.sheet='readscan';}
      else if(a==='simulate'){
        if(v.sheet==='writescan')v.sheet=v.lockAfterWrite&&v.lockCase==='卡片不支持'?'lockUnsupported':'cardready';
        else if(v.sheet==='lockscan'){v.lockStatus=v.lockCase==='锁定成功'?'locked':'unknown';v.screen='complete';v.sheet=v.lockStatus==='locked'?null:'lockIssue';}
        else if(v.sheet==='readscan'){v.screen='unlock';v.sheet=null;}
        else{v.screen='complete';v.lockStatus=v.lockAfterWrite?'pending':'';v.sheet=v.lockAfterWrite?'confirmReadOnly':null;}
      }
      else if(a==='confirmReadOnly'){v.sheet='lockscan';}
      else if(a==='skipReadOnly'){v.lockStatus='unprotected';v.sheet='backup';}
      else if(a==='backLockSettings'){v.screen='write';v.sheet=null;}
      else if(a==='confirmWrite'){v.sheet='writearmed';}
      else if(a==='denyCamera'){v.sheet='denied';}
      else if(a==='simulateCaptureFailure'){v.sheet='failed';}
      else if(a==='import'){v.screen='unlock';v.sheet=null;}
      else if(a==='decrypt'){v.screen='revealed';v.sheet=null;}
      else if(a==='backup'){v.sheet='backup';}
      else if(a==='saveBackup'){v.backup=true;v.sheet=null;if(v.afterBackup){v.screen=v.afterBackup;v.afterBackup=null;}}
      else if(a==='another'){v.lockAfterWrite=false;v.lockStatus='';if(!v.backup){v.sheet='backup';v.afterBackup='write';v.duplicate=true;}else{v.screen='write';v.duplicate=true;}}
      else if(a==='private')v.privateVisible=!v.privateVisible;
      else if(a==='copy'){toast(v,'copiedDemo');persist();return;}
      render(v);persist();
    }
    root.querySelectorAll('[data-stage]').forEach(el=>{const id=el.dataset.stage;states[id]=defaults(id);});
    applySaved(window.openai?.widgetState);
    for(const v of Object.values(states))render(v);
    root.addEventListener('click',e=>{
      const stage=e.target.closest('[data-stage]');if(!stage)return;const v=states[stage.dataset.stage];
      const detail=e.target.closest('.bt-security-detail>summary');if(detail){const panel=detail.parentElement,index=Number(panel.dataset.securitySection),open=v.securityOpen||[0];v.securityOpen=panel.open?open.filter(i=>i!==index):[...open,index];persist();return;}
      if(e.target.classList.contains('bt-shade')){act(v,v.sheet==='disclaimer'?'disagree':'close');return;}
      const language=e.target.closest('[data-language]');if(language){v.language=language.dataset.language;v.sheet=null;render(v);persist();return;}
      const btn=e.target.closest('[data-act]');if(!btn)return;
      if(btn.dataset.act==='eye'){const input=stage.querySelector(`[data-input="${btn.dataset.for}"]`);if(input){input.type=input.type==='password'?'text':'password';btn.innerHTML=I(input.type==='password'?'eye-off':'eye');if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});}return;}
      act(v,btn.dataset.act);
    });
    root.addEventListener('input',e=>{const stage=e.target.closest('[data-stage]');if(!stage)return;const v=states[stage.dataset.stage];const k=e.target.dataset.input;if(k){v[k]=e.target.value;if(k==='pass'){const label=stage.querySelector('[data-strength]');if(label)label.textContent=strength(v);}if(k==='note'){const count=stage.querySelector('[data-note-count]');if(count)count.textContent=Array.from(v.note.normalize('NFC')).length;}}});
    root.addEventListener('change',e=>{if(e.target.dataset.toggle==='readonly'){const v=states[e.target.closest('[data-stage]').dataset.stage];v.lockAfterWrite=e.target.checked;render(v);persist();}else if(e.target.dataset.toggle==='camera'){const v=states[e.target.closest('[data-stage]').dataset.stage];v.enhanced=e.target.checked;v.cameraReady=false;v.pass="";v.confirm="";render(v);persist();}});
    window.addEventListener('openai:set_globals',e=>{applySaved(e.detail?.globals?.widgetState);for(const v of Object.values(states))render(v);});
    if(globalThis.Tweak)for(const [id,v] of Object.entries(states)){
      const tweak=new Tweak({container:root.querySelector(`[data-stage="${id}"]`),onChange:()=>{render(v);persist();}});
      tweak.addSelect(v,'phoneLanguage',{label:'模拟手机语言',options:[{label:'中文',value:'zh'},{label:'English',value:'en'},{label:'日本語',value:'ja'},{label:'한국어',value:'ko'}]});
      tweak.addSelect(v,'cameraCase',{label:'相机场景',options:['正常采集','权限未授权','采集失败']});
      tweak.addSelect(v,'readCase',{label:'读取样例',options:['含备注新卡','旧卡无备注']});
      tweak.addSelect(v,'lockCase',{label:'锁卡结果',options:['锁定成功','卡片不支持','锁定未确认']});
    }
  })();
  </script>
</div>
